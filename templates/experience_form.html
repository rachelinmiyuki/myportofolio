{% extends "base.html" %}
{% block meta %}
    <title>Add Experience - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="experience">
            <div class="container">
                <h1>Add New Axperience</h1>
                <form method="post"
                    action="{% if is_update %}{% url 'main:update_experience' experience.id %}
                            {% else %}
                            {% url 'main:create_experience' %}
                            {% endif %}"
                    class="experience-form">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Simpan Pengalaman</button>
                    <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
